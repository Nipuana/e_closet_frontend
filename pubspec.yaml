name: e_closet
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.12.0

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0

  # Local Database (Offline Storage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Networking
  dio: ^5.4.1
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0

  # Authentication
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  jwt_decoder: ^2.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # Media Handling
  flutter_image_compress: ^2.2.0
  video_compress: ^3.1.3
  image_picker: ^1.0.7
  file_picker: ^10.1.9
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  video_thumbnail: ^0.5.3
  flutter_svg: ^2.0.10+1
  just_audio: ^0.9.36
  audio_session: ^0.1.6

  # Real-time Features
  web_socket_channel: ^3.0.3

  # Utilities
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  intl: ^0.20.2

  # Background Tasks
  workmanager: ^0.9.0+3

  # Notifications (plan / outfit reminders)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Native splash (preserve/remove at startup)
  flutter_native_splash: ^2.4.6

  # Permissions
  permission_handler: ^12.0.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  app_links: ^6.4.0
  sensors_plus: ^6.1.1
  test_cov: ^1.0.1
  test_cov_console: ^0.2.2

dev_dependencies:
  analyzer: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.4.4
  build_runner: ^2.4.13

  # Code Generation
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.3
  fake_async: ^1.3.1

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
  
  #Custom Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    # Display serif (headings / brand wordmark)
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Light.ttf
          weight: 300
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
    # Body sans (UI text, labels, buttons)
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appicon.png"
  adaptive_icon_background: "assets/icons/appicon_background.png"
  adaptive_icon_foreground: "assets/icons/appicon_foreground.png"
  remove_alpha_ios: true

# Native (OS) splash — painted before the Flutter engine boots. Matched to the
# custom Flutter splash (bone background + white badge) for a seamless handoff.
flutter_native_splash:
  color: "#FBF9F6"
  image: "assets/icons/splash_logo.png"
  branding: "assets/icons/splash_branding.png"
  android: true
  ios: true
  fullscreen: false
  android_12:
    color: "#FBF9F6"
    image: "assets/icons/splash_logo.png"
    branding: "assets/icons/splash_branding.png"
